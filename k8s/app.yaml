apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-demo-app
  labels:
    app: k8s-demo-app
spec:
  replicas: 2 # 启动 2 个 Pod 副本
  selector:
    matchLabels:
      app: k8s-demo-app
  template:
    metadata:
      labels:
        app: k8s-demo-app
    spec:
      containers:
      - name: k8s-demo-app
        image: ghcr.io/flynn-desu/k8s-demo-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-demo-app-service
spec:
  type: NodePort # 暴露节点端口，方便本地直接访问
  selector:
    app: k8s-demo-app # 绑定打上 app=k8s-demo-app 标签的 Pod[cite: 1]
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080 # 将集群服务映射到宿主机的 30080 端口